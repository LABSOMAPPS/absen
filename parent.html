<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14b8a6">
<link rel="manifest" href="manifest.json">
<title>SIABSEN — Portal Orang Tua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="seed.js"></script>
<style>
:root { --primary:#14b8a6; --primary-2:#06b6d4; --primary-dark:#0d9488; --success:#10b981; --warning:#f59e0b; --danger:#ef4444; --info:#06b6d4; --bg:#f0fdfa; --card:rgba(255,255,255,.85); --card-solid:#fff; --text:#0f172a; --text-2:#475569; --muted:#94a3b8; --border:rgba(20,184,166,.18); --border-2:rgba(148,163,184,.3); --shadow-sm:0 1px 3px rgba(15,23,42,.06); --shadow-md:0 4px 6px -1px rgba(15,23,42,.06); --shadow-lg:0 12px 24px -8px rgba(15,23,42,.12); --shadow-xl:0 24px 48px -12px rgba(15,23,42,.18); }
[data-theme="dark"] { --bg:#0a1a1a; --card:rgba(30,41,59,.7); --card-solid:#1e293b; --text:#f1f5f9; --text-2:#cbd5e1; --muted:#64748b; --border:rgba(20,184,166,.2); --border-2:rgba(148,163,184,.2); --shadow-xl:0 24px 48px rgba(0,0,0,.6); }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }
body::before { content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(700px circle at 10% 0%, rgba(20,184,166,.15), transparent 40%), radial-gradient(600px circle at 90% 100%, rgba(6,182,212,.12), transparent 40%); }
.hidden { display:none !important; }
.topbar { position:sticky; top:0; z-index:50; background:linear-gradient(135deg, rgba(20,184,166,.97), rgba(6,182,212,.97)); backdrop-filter: blur(20px); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 4px 20px -4px rgba(20,184,166,.4); padding-top: max(14px, env(safe-area-inset-top)); }
.topbar .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; }
.topbar .brand .ico { font-size:22px; }
.user-info { display:flex; align-items:center; gap:8px; }
.avatar { width:34px; height:34px; border-radius:11px; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; border:1.5px solid rgba(255,255,255,.3); }
.btn-icon { background:rgba(255,255,255,.18); color:#fff; border:1.5px solid rgba(255,255,255,.25); width:34px; height:34px; border-radius:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; transition:.2s; }
.content { padding:18px; max-width:900px; margin:0 auto; padding-bottom:110px; }
.welcome-card { background:linear-gradient(135deg, rgba(20,184,166,.15), rgba(6,182,212,.1)); border:1px solid var(--border); border-radius:22px; padding:20px; margin-bottom:18px; }
.welcome-card h2 { font-size:18px; font-weight:800; letter-spacing:-.4px; margin-bottom:6px; }
.welcome-card p { font-size:13px; color:var(--text-2); line-height:1.6; }
.child-list { display:flex; flex-direction:column; gap:14px; }
.child-card { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:18px; box-shadow:var(--shadow-md); cursor:pointer; position:relative; overflow:hidden; transition:.25s; }
.child-card::before { content:''; position:absolute; top:0; left:0; width:5px; height:100%; background:linear-gradient(180deg,#14b8a6,#06b6d4); }
.child-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); }
.child-head { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.child-avatar { width:56px; height:56px; border-radius:18px; flex-shrink:0; background:linear-gradient(135deg,rgba(20,184,166,.2),rgba(6,182,212,.15)); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:var(--primary-dark); border:2px solid rgba(20,184,166,.25); }
.child-info { flex:1; min-width:0; }
.child-nama { font-weight:800; font-size:16px; letter-spacing:-.3px; }
.child-meta { font-size:12px; color:var(--text-2); margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; }
.child-arrow { font-size:20px; color:var(--muted); }
.child-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
.cstat { text-align:center; padding:10px 4px; border-radius:12px; background:rgba(248,250,252,.7); border:1px solid var(--border); }
[data-theme="dark"] .cstat { background:rgba(15,23,42,.4); }
.cstat .v { font-size:18px; font-weight:800; letter-spacing:-.5px; }
.cstat .l { font-size:10px; color:var(--muted); margin-top:2px; font-weight:700; text-transform:uppercase; }
.cstat.h .v { color:var(--success); } .cstat.i .v { color:var(--info); } .cstat.s .v { color:var(--warning); } .cstat.a .v { color:var(--danger); }
.child-progress { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; background:linear-gradient(135deg, rgba(20,184,166,.08), rgba(6,182,212,.06)); }
.child-progress .label { font-size:12px; color:var(--text-2); font-weight:600; }
.child-progress .value { font-size:20px; font-weight:900; color:var(--primary-dark); letter-spacing:-.5px; }
.pbar { flex:1; height:8px; background:rgba(148,163,184,.2); border-radius:4px; overflow:hidden; }
.pfill { height:100%; border-radius:4px; background:linear-gradient(90deg,#14b8a6,#06b6d4); transition:width .6s; }
.pfill.warn { background:linear-gradient(90deg,#f59e0b,#fbbf24); }
.pfill.danger { background:linear-gradient(90deg,#ef4444,#f87171); }
.announce-list { display:flex; flex-direction:column; gap:12px; }
.announce-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; box-shadow:var(--shadow-sm); border-left:4px solid var(--primary); }
.announce-card.kategori-penting { border-left-color:#ef4444; background:linear-gradient(135deg,rgba(239,68,68,.04),transparent); }
.announce-card.kategori-acara { border-left-color:#f59e0b; background:linear-gradient(135deg,rgba(245,158,11,.04),transparent); }
.announce-head { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
.announce-icon { width:38px; height:38px; border-radius:12px; flex-shrink:0; background:linear-gradient(135deg,rgba(20,184,166,.15),rgba(6,182,212,.1)); display:flex; align-items:center; justify-content:center; font-size:18px; }
.announce-card.kategori-penting .announce-icon { background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(220,38,38,.1)); }
.announce-card.kategori-acara .announce-icon { background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(217,119,6,.1)); }
.announce-title { font-weight:800; font-size:14.5px; line-height:1.3; }
.announce-date { font-size:11px; color:var(--muted); margin-top:4px; font-weight:600; }
.announce-body { font-size:13px; color:var(--text-2); line-height:1.7; white-space:pre-line; }
.badge-kategori { display:inline-block; padding:3px 9px; border-radius:20px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; background:rgba(20,184,166,.15); color:var(--primary-dark); margin-left:auto; align-self:flex-start; }
.badge-kategori.penting { background:rgba(239,68,68,.15); color:#b91c1c; }
.badge-kategori.acara { background:rgba(245,158,11,.15); color:#b45309; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:40; background:var(--card-solid); backdrop-filter: blur(20px); border-top:1px solid var(--border); display:flex; padding:8px; padding-bottom: max(8px, env(safe-area-inset-bottom)); box-shadow:0 -8px 24px -8px rgba(15,23,42,.12); }
.nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px; border:none; background:transparent; border-radius:14px; cursor:pointer; transition:.2s; color:var(--muted); font-weight:700; font-size:10.5px; font-family:inherit; }
.nav-btn .ico { font-size:20px; }
.nav-btn.active { color:var(--primary-dark); background:linear-gradient(135deg,rgba(20,184,166,.15),rgba(6,182,212,.1)); }
[data-theme="dark"] .nav-btn.active { color:#5eead4; }
.profile-header { text-align:center; padding:24px 16px; background:linear-gradient(135deg, rgba(20,184,166,.15), rgba(6,182,212,.1)); border-radius:22px; border:1px solid var(--border); margin-bottom:16px; }
.profile-avatar { width:88px; height:88px; margin:0 auto 14px; border-radius:28px; background:linear-gradient(135deg,#14b8a6,#06b6d4); display:flex; align-items:center; justify-content:center; font-size:42px; font-weight:800; color:#fff; box-shadow:0 12px 32px -8px rgba(20,184,166,.5); }
.profile-nama { font-size:20px; font-weight:800; letter-spacing:-.4px; margin-bottom:4px; }
.profile-role { display:inline-block; padding:4px 12px; border-radius:20px; background:rgba(20,184,166,.2); color:var(--primary-dark); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; }
.info-list { background:var(--card); border:1px solid var(--border); border-radius:18px; overflow:hidden; box-shadow:var(--shadow-sm); }
.info-row { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); font-size:13.5px; }
.info-row:last-child { border-bottom:none; }
.info-row .lbl { color:var(--text-2); font-weight:600; display:flex; align-items:center; gap:8px; }
.info-row .val { font-weight:700; text-align:right; }
.btn-logout { width:100%; padding:15px; margin-top:16px; background:linear-gradient(135deg,rgba(239,68,68,.12),rgba(220,38,38,.08)); color:#b91c1c; border:1.5px solid rgba(239,68,68,.3); border-radius:16px; font-weight:800; font-size:14px; cursor:pointer; font-family:inherit; }
.modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.65); backdrop-filter: blur(6px); display:flex; align-items:flex-end; justify-content:center; z-index:200; }
.modal-card { background:var(--card-solid); width:100%; max-width:640px; max-height:92vh; display:flex; flex-direction:column; border-radius:28px 28px 0 0; overflow:hidden; border:1px solid var(--border); border-bottom:none; }
.modal-head { padding:16px 20px; display:flex; align-items:center; justify-content:space-between; background:linear-gradient(135deg,#14b8a6,#06b6d4); color:#fff; }
.modal-head h3 { font-size:15px; font-weight:800; }
.modal-close { background:rgba(255,255,255,.2); color:#fff; border:none; width:32px; height:32px; border-radius:10px; cursor:pointer; font-size:16px; }
.modal-body { padding:20px; overflow-y:auto; flex:1; }
.table-wrap { overflow-x:auto; border-radius:14px; border:1px solid var(--border); background:var(--card-solid); }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:11px 13px; text-align:left; border-bottom:1px solid var(--border); }
th { background:linear-gradient(180deg, rgba(20,184,166,.08), rgba(20,184,166,.03)); font-weight:800; font-size:11px; text-transform:uppercase; color:var(--text-2); }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover { background:rgba(20,184,166,.05); }
.pill { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:800; }
.pill.h { background:rgba(16,185,129,.15); color:#047857; }
.pill.i { background:rgba(6,182,212,.15); color:#0e7490; }
.pill.s { background:rgba(245,158,11,.15); color:#b45309; }
.pill.a { background:rgba(239,68,68,.15); color:#b91c1c; }
[data-theme="dark"] .pill.h { color:#34d399; } [data-theme="dark"] .pill.i { color:#22d3ee; }
[data-theme="dark"] .pill.s { color:#fbbf24; } [data-theme="dark"] .pill.a { color:#f87171; }
.section-title { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--text-2); margin:20px 0 10px; }
.empty { text-align:center; padding:50px 20px; color:var(--muted); }
.empty .ico { font-size:54px; margin-bottom:12px; opacity:.5; }
.empty p { font-size:14px; font-weight:500; line-height:1.6; }
#toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(120px); background:linear-gradient(135deg,#0f172a,#1e293b); color:#fff; padding:14px 22px; border-radius:14px; font-size:14px; font-weight:600; z-index:999; transition:.35s; opacity:0; box-shadow:0 20px 40px -8px rgba(0,0,0,.5); max-width:90vw; }
#toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
@media (max-width:480px) { .content { padding:14px; } .cstat { padding:8px 2px; } .cstat .v { font-size:16px; } }
</style>
</head>
<body>
<div id="appPage" class="hidden">
  <div class="topbar">
    <div class="brand"><span class="ico">👨‍👩‍👧</span> Portal Ortu</div>
    <div class="user-info">
      <div class="avatar" id="userAvatar">O</div>
      <button class="btn-icon" id="themeToggle">🌙</button>
    </div>
  </div>
  <div class="content">
    <div id="viewBeranda">
      <div class="welcome-card">
        <h2 id="welcomeTitle">Assalamu'alaikum 👋</h2>
        <p id="welcomeSub">Pantau kehadiran & aktivitas anak Anda.</p>
      </div>
      <div class="section-title">👦 Anak Saya</div>
      <div class="child-list" id="childList"></div>
    </div>
    <div id="viewPengumuman" class="hidden">
      <div class="section-title" style="margin-top:0">📢 Pengumuman Madrasah</div>
      <div class="announce-list" id="announceList"></div>
    </div>
    <div id="viewProfil" class="hidden">
      <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar">O</div>
        <div class="profile-nama" id="profileNama">Orang Tua</div>
        <div class="profile-role">Wali Murid</div>
      </div>
      <div class="info-list" id="profileInfo"></div>
      <button class="btn-logout" id="logoutBtn">⏻ Keluar</button>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="beranda"><span class="ico">🏠</span> Beranda</button>
    <button class="nav-btn" data-view="pengumuman"><span class="ico">📢</span> Pengumuman</button>
    <button class="nav-btn" data-view="profil"><span class="ico">👤</span> Profil</button>
  </nav>
</div>
<div id="modalChild" class="modal-overlay hidden"><div class="modal-card">
  <div class="modal-head"><h3 id="childModalTitle">Detail Anak</h3><button class="modal-close" onclick="closeChildModal()">✕</button></div>
  <div class="modal-body" id="childModalBody"></div>
</div></div>
<div id="toast"></div>
<script>
let currentUser = null;
const $ = id => document.getElementById(id);
const getKelas = () => JSON.parse(localStorage.getItem('siabsen_kelas') || '[]');
const getSiswa = () => JSON.parse(localStorage.getItem('siabsen_siswa') || '[]');
const getRecords = () => JSON.parse(localStorage.getItem('siabsen_records') || '[]');
const getPengumuman = () => JSON.parse(localStorage.getItem('siabsen_pengumuman') || '[]');
function toast(msg, ms=2400){ const t=$('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(t._to); t._to=setTimeout(()=>t.classList.remove('show'), ms); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatTanggal(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function formatTanggalPanjang(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}); }
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); const b=$('themeToggle'); if(b) b.textContent = t==='dark'?'☀️':'🌙'; localStorage.setItem('siabsen_theme', t); }
applyTheme(localStorage.getItem('siabsen_theme') || 'light');

(function checkAuth(){
  const u = JSON.parse(localStorage.getItem('siabsen_user') || 'null');
  if (!u || u.role !== 'orang_tua') { location.href = 'login.html'; return; }
  const ortuList = JSON.parse(localStorage.getItem('siabsen_ortu') || '[]');
  const full = ortuList.find(o => o.id === u.id);
  if (!full) { location.href = 'login.html'; return; }
  currentUser = full;
  $('appPage').classList.remove('hidden');
  initApp();
})();

function initApp(){
  $('userAvatar').textContent = currentUser.nama.charAt(0).toUpperCase();
  $('themeToggle').onclick = () => { const c = document.documentElement.getAttribute('data-theme'); applyTheme(c==='dark'?'light':'dark'); };
  document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => switchView(b.dataset.view));
  $('welcomeTitle').textContent = `Assalamu'alaikum, ${currentUser.nama.split(' ').slice(-1)[0]} 👋`;
  $('welcomeSub').textContent = `Anda terdaftar sebagai ${currentUser.hubungan} dari ${currentUser.anakNis.length} siswa.`;
  $('logoutBtn').onclick = () => { if (!confirm('Keluar?')) return; localStorage.removeItem('siabsen_user'); location.href='login.html'; };
  $('modalChild').addEventListener('click', e => { if (e.target.id === 'modalChild') closeChildModal(); });
  renderBeranda();
  renderPengumuman();
  renderProfil();
}
function switchView(view){
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  ['beranda','pengumuman','profil'].forEach(v => $('view' + v.charAt(0).toUpperCase() + v.slice(1)).classList.toggle('hidden', v !== view));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderBeranda(){
  const wrap = $('childList');
  const kelasMap = {}; getKelas().forEach(k => kelasMap[k.id] = k.nama);
  const siswaList = getSiswa();
  const records = getRecords();
  const children = currentUser.anakNis.map(nis => siswaList.find(s => s.nis === nis)).filter(Boolean);
  if (!children.length) { wrap.innerHTML = `<div class="empty"><div class="ico">👦</div><p>Belum ada data anak yang terhubung.</p></div>`; return; }
  const now = new Date();
  const mS = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
  const mE = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(new Date(now.getFullYear(), now.getMonth()+1, 0).getDate()).padStart(2,'0')}`;
  const blnLbl = now.toLocaleDateString('id-ID', { month:'long', year:'numeric' });
  wrap.innerHTML = children.map(s => {
    const recs = records.filter(r => r.kelasId === s.kelasId && r.tanggal >= mS && r.tanggal <= mE);
    const c = { Hadir:0, Izin:0, Sakit:0, Alpha:0 };
    recs.forEach(r => { const d = r.students.find(x => x.nis === s.nis); if (d) c[d.status]++; });
    const total = c.Hadir + c.Izin + c.Sakit + c.Alpha;
    const p = total ? Math.round((c.Hadir/total)*100) : 0;
    const cls = p>=90?'':p>=75?'warn':'danger';
    return `<div class="child-card" onclick="openChildDetail('${escapeHtml(s.nis)}')">
      <div class="child-head">
        <div class="child-avatar">${escapeHtml(s.nama.charAt(0))}</div>
        <div class="child-info">
          <div class="child-nama">${escapeHtml(s.nama)}</div>
          <div class="child-meta"><span>🏫 ${escapeHtml(kelasMap[s.kelasId]||'-')}</span><span>🆔 ${escapeHtml(s.nis)}</span></div>
        </div>
        <div class="child-arrow">›</div>
      </div>
      <div class="child-stats">
        <div class="cstat h"><div class="v">${c.Hadir}</div><div class="l">Hadir</div></div>
        <div class="cstat i"><div class="v">${c.Izin}</div><div class="l">Izin</div></div>
        <div class="cstat s"><div class="v">${c.Sakit}</div><div class="l">Sakit</div></div>
        <div class="cstat a"><div class="v">${c.Alpha}</div><div class="l">Alpha</div></div>
      </div>
      <div class="child-progress">
        <div><div class="label">Kehadiran ${blnLbl}</div><div class="value">${p}%</div></div>
        <div class="pbar"><div class="pfill ${cls}" style="width:${p}%"></div></div>
      </div>
    </div>`;
  }).join('');
}

function openChildDetail(nis){
  const siswa = getSiswa().find(s => s.nis === nis);
  if (!siswa) return toast('⚠️ Data anak tidak ditemukan');
  const kelas = getKelas().find(k => k.id === siswa.kelasId);
  const records = getRecords().filter(r => r.kelasId === siswa.kelasId);
  const myRecords = records.map(r => { const d = r.students.find(x => x.nis === nis); return d ? { ...r, myStatus: d.status, myNote: d.note } : null; }).filter(Boolean).sort((a,b) => b.tanggal.localeCompare(a.tanggal));
  const c = { Hadir:0, Izin:0, Sakit:0, Alpha:0 };
  myRecords.forEach(r => c[r.myStatus]++);
  const total = c.Hadir + c.Izin + c.Sakit + c.Alpha;
  const p = total ? Math.round((c.Hadir/total)*100) : 0;
  $('childModalTitle').textContent = `👦 ${siswa.nama}`;
  $('childModalBody').innerHTML = `
    <div style="background:linear-gradient(135deg,rgba(20,184,166,.1),rgba(6,182,212,.06));padding:14px;border-radius:16px;margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <div class="child-avatar" style="width:48px;height:48px;font-size:22px;margin:0">${escapeHtml(siswa.nama.charAt(0))}</div>
      <div><div style="font-weight:800;font-size:15px">${escapeHtml(siswa.nama)}</div>
      <div style="font-size:12px;color:var(--text-2);margin-top:2px">🏫 ${escapeHtml(kelas?kelas.nama:'-')} · 🆔 ${escapeHtml(siswa.nis)}</div></div>
    </div>
    <div class="child-stats" style="margin-bottom:16px">
      <div class="cstat h"><div class="v">${c.Hadir}</div><div class="l">Hadir</div></div>
      <div class="cstat i"><div class="v">${c.Izin}</div><div class="l">Izin</div></div>
      <div class="cstat s"><div class="v">${c.Sakit}</div><div class="l">Sakit</div></div>
      <div class="cstat a"><div class="v">${c.Alpha}</div><div class="l">Alpha</div></div>
    </div>
    <div class="child-progress" style="margin-bottom:20px">
      <div><div class="label">Kehadiran Total</div><div class="value">${p}%</div></div>
      <div class="pbar"><div class="pfill ${p>=90?'':p>=75?'warn':'danger'}" style="width:${p}%"></div></div>
    </div>
    <div class="section-title" style="margin-top:0">📅 Riwayat Absensi (${myRecords.length} pertemuan)</div>
    ${!myRecords.length
      ? `<div class="empty" style="padding:30px"><div class="ico">📭</div><p>Belum ada riwayat absensi.</p></div>`
      : `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Mapel</th><th style="text-align:center">Status</th><th>Catatan</th></tr></thead><tbody>
        ${myRecords.slice(0, 40).map(r => { const cls = r.myStatus==='Hadir'?'h':r.myStatus==='Izin'?'i':r.myStatus==='Sakit'?'s':'a'; return `<tr><td style="white-space:nowrap"><small>${formatTanggal(r.tanggal)}</small></td><td>${escapeHtml(r.mapel)}</td><td style="text-align:center"><span class="pill ${cls}">${r.myStatus}</span></td><td><small style="color:var(--muted)">${escapeHtml(r.myNote)||'—'}</small></td></tr>`; }).join('')}
      </tbody></table></div>`}`;
  $('modalChild').classList.remove('hidden');
}
function closeChildModal(){ $('modalChild').classList.add('hidden'); }

function renderPengumuman(){
  const list = getPengumuman().slice().sort((a,b) => b.tanggal.localeCompare(a.tanggal));
  const wrap = $('announceList');
  if (!list.length) { wrap.innerHTML = `<div class="empty"><div class="ico">📢</div><p>Belum ada pengumuman.</p></div>`; return; }
  const ic = { umum:'📌', penting:'⚠️', acara:'🎉' };
  const lb = { umum:'UMUM', penting:'PENTING', acara:'ACARA' };
  wrap.innerHTML = list.map(p => `
    <div class="announce-card kategori-${p.kategori}">
      <div class="announce-head">
        <div class="announce-icon">${ic[p.kategori]||'📌'}</div>
        <div style="flex:1;min-width:0">
          <div class="announce-title">${escapeHtml(p.judul)}</div>
          <div class="announce-date">📅 ${formatTanggalPanjang(p.tanggal)} · oleh ${escapeHtml(p.author||'Admin')}</div>
        </div>
        <span class="badge-kategori ${p.kategori}">${lb[p.kategori]||p.kategori.toUpperCase()}</span>
      </div>
      <div class="announce-body">${escapeHtml(p.isi)}</div>
    </div>`).join('');
}

function renderProfil(){
  $('profileAvatar').textContent = currentUser.nama.charAt(0).toUpperCase();
  $('profileNama').textContent = currentUser.nama;
  const anakNames = currentUser.anakNis.map(nis => { const s = getSiswa().find(x => x.nis === nis); return s ? s.nama : nis; }).join(', ') || '—';
  $('profileInfo').innerHTML = `
    <div class="info-row"><div class="lbl">👤 Nama</div><div class="val">${escapeHtml(currentUser.nama)}</div></div>
    <div class="info-row"><div class="lbl">👨‍👩‍👧 Hubungan</div><div class="val">${escapeHtml(currentUser.hubungan)}</div></div>
    <div class="info-row"><div class="lbl">🏷️ Username</div><div class="val">${escapeHtml(currentUser.username||'-')}</div></div>
    <div class="info-row"><div class="lbl">📧 Email</div><div class="val">${escapeHtml(currentUser.email)}</div></div>
    <div class="info-row"><div class="lbl">📱 WhatsApp</div><div class="val">${escapeHtml(currentUser.wa||currentUser.hp)}</div></div>
    <div class="info-row"><div class="lbl">👦 Anak</div><div class="val">${escapeHtml(anakNames)}</div></div>`;
}
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<script src="notif.js"></script>
</body>
